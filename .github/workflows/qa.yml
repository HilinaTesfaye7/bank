name: QA checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: API, SQL reconciliation and AI evaluation tests
        run: pytest -m "not ui" --junitxml=reports/unit.xml

      - name: Playwright UI tests
        run: pytest -m ui --junitxml=reports/ui.xml

      - name: Fraud model release gate
        run: python -m evals.run_fraud_eval --candidate data/fraud_scores_model_v1.json

      - name: Chatbot release gate
        run: python -m evals.run_chatbot_eval --candidate data/chatbot_answers_v1.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            fraud_report.json
            chatbot_report.json
